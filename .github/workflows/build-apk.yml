name: Build HoneyGram APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build HoneyGram APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Prepare Signing Keystore & Keys
        run: |
          mkdir -p TMessagesProj/config
          if [ ! -f TMessagesProj/config/debug.keystore ]; then
            keytool -genkeypair -v -keystore TMessagesProj/config/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "APP_ID=2040" > API_KEYS
          echo "APP_HASH=b18441a1ff607e10a989891a5462e627" >> API_KEYS
          echo "MAPS_V2_API=" >> API_KEYS
          echo "SIGNING_KEY_STORE_PASSWORD=android" >> API_KEYS
          echo "SIGNING_KEY_ALIAS=androiddebugkey" >> API_KEYS
          echo "SIGNING_KEY_PASSWORD=android" >> API_KEYS

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build HoneyGram Universal & ARM64 APKs
        run: ./gradlew assembleAfatRelease assembleArm64Release -x test --parallel

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoneyGram-Release-APKs
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: TMessagesProj/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
