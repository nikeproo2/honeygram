name: Build HoneyGram APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build HoneyGram Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build HoneyGram Release APK
        run: ./gradlew assembleAfatRelease -x test --parallel --max-workers=4

      - name: Sign APK (if keystore secret exists)
        if: env.SIGNING_KEY != ''
        uses: ralfirza/action-sign-apk@v1
        with:
          apk-path: TMessagesProj/build/outputs/apk/afat/release/*.apk
          key-store-base64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          key-store-password: ${{ secrets.KEY_STORE_PASSWORD }}
          key-password: ${{ secrets.KEY_PASSWORD }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoneyGram-Release-APKs
          path: |
            TMessagesProj/build/outputs/apk/afat/release/*.apk
            TMessagesProj/build/outputs/apk/afat/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TMessagesProj/build/outputs/apk/afat/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
